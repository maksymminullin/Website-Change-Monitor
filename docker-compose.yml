services:
  postgres:
    image: postgres:16-alpine
    container_name: watcher-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: watcher
      POSTGRES_USER: watcher
      POSTGRES_PASSWORD: watcher
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U watcher -d watcher"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
